services:
  postgres:
    image: postgres:16-alpine
    container_name: snapflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snapflow}
      POSTGRES_USER: ${POSTGRES_USER:-snapflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-db-password}
    ports:
      - "55432:5432"
    volumes:
      - snapflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snapflow} -d ${POSTGRES_DB:-snapflow}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  snapflow_postgres_data:
